; SiteX Post — Horizon (recommended on Linux/aaPanel).
; Copy to /etc/supervisor/conf.d/ (or paste into aaPanel Supervisor Manager),
; replace <APP_DIR> and the user, then: supervisorctl reread && supervisorctl update
;
; Horizon starts one process pool per supervisor defined in backend/config/horizon.php:
;   supervisor-core       critical, default, notifications, billing
;   supervisor-connector  connector
;   supervisor-publishing publishing
;   supervisor-ai         writing, research, factcheck   (max 3 processes, timeout 300 s)
;   supervisor-media      media
;   supervisor-analytics  analytics
;
; stopwaitsecs must exceed the longest job timeout (300 s) so a deploy/restart
; lets running jobs finish. A job killed anyway is NOT lost: its workflow run keeps
; a lease in the DB and `sitex:workflows:recover` (scheduler, every minute) resumes it.

[program:sitexpost-horizon]
process_name=%(program_name)s
command=php <APP_DIR>/backend/artisan horizon
directory=<APP_DIR>/backend
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=<APP_DIR>/backend/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
