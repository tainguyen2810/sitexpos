; SiteX Post — alternative WITHOUT Horizon (plain queue:work), e.g. hosts where
; the Horizon dashboard is not wanted. Use EITHER this file OR sitexpost-horizon.conf.
; Replace <APP_DIR> and the user, then: supervisorctl reread && supervisorctl update
;
; --timeout=300 < REDIS_QUEUE_RETRY_AFTER (330) < SITEX_WORKFLOW_LEASE_SECONDS (360).
; Keep that order if you change any of them.

; General queues (priority order left to right).
[program:sitexpost-worker-core]
process_name=%(program_name)s_%(process_num)02d
command=php <APP_DIR>/backend/artisan queue:work redis --queue=critical,default,notifications,billing,connector,publishing,media,analytics --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=<APP_DIR>/backend
user=www
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=<APP_DIR>/backend/storage/logs/worker-core.log

; AI workflow queues. Keep numprocs small: provider rate limits and the per-workspace
; concurrency limit (SITEX_WORKFLOW_TENANT_CONCURRENCY) apply on top.
[program:sitexpost-worker-ai]
process_name=%(program_name)s_%(process_num)02d
command=php <APP_DIR>/backend/artisan queue:work redis --queue=writing,research,factcheck --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=<APP_DIR>/backend
user=www
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=<APP_DIR>/backend/storage/logs/worker-ai.log
