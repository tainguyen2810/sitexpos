; SiteX Post — PHP settings for the Docker image
expose_php = Off
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code inside the image never changes; config/route caches are rebuilt before
; PHP-FPM starts, so timestamp checks are not needed.
opcache.validate_timestamps = 0
