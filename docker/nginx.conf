# SiteX Post — Nginx inside the container. TLS terminates at the host's reverse
# proxy (aaPanel), which forwards each domain to one of these ports:
#   8080  api.<domain>    Laravel (backend/public)
#   8081  app.<domain>    customer SPA
#   8082  admin.<domain>  admin SPA
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    access_log /dev/stdout;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API + installer (Laravel). Client IP / HTTPS come from X-Forwarded-* and are
    # trusted by Laravel only from SITEX_TRUSTED_PROXIES.
    server {
        listen 8080 default_server;
        root /var/www/html/backend/public;
        index index.php;
        include /etc/nginx/sitex-noindex.conf;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_read_timeout 660s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Customer SPA
    server {
        listen 8081;
        root /var/www/html/frontend/dist/customer;
        include /etc/nginx/sitex-noindex.conf;
        include /etc/nginx/sitex-spa.conf;
    }

    # Admin SPA
    server {
        listen 8082;
        root /var/www/html/frontend/dist/admin;
        include /etc/nginx/sitex-noindex.conf;
        include /etc/nginx/sitex-spa.conf;
    }
}
