; SiteX Post — PHP-FPM pool (overrides the image's www.conf).
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
; Keep the container's environment (SITEX_ENV_DIR, SITEX_TRUSTED_PROXIES, ...).
clear_env = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; The installer's final step may run migrations for several minutes.
request_terminate_timeout = 660
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
