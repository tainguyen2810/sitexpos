# SiteX Post is an application (API, customer app, admin), not a public website:
# search engines must never index any of the three domains. Included in every
# server block; nginx-spa.conf repeats the header in its locations because a
# location with its own add_header does not inherit the server-level ones.
add_header X-Robots-Tag "noindex, nofollow" always;

location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 200 "User-agent: *\nDisallow: /\n";
}
