name: Release

# Automatic releases (docs/DOCKER.md §4): when a merge to main changes
# backend/config/sitex.php and its `version` has no tag yet, create tag + GitHub
# release v<version> (notes from backend/CHANGELOG.md), then build and push the
# image :<version> and :latest via the Docker image workflow.
# A tag created with GITHUB_TOKEN does not trigger other workflows, so the image
# build is called from here. A release created by hand still works as before.
on:
  push:
    branches: [main]
    paths: [backend/config/sitex.php]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          V=$(sed -nE "s/^ {4}'version' => '([0-9]+\.[0-9]+\.[0-9]+)',.*/\1/p" backend/config/sitex.php | head -1)
          [ -n "$V" ] || { echo "::error::version not found in backend/config/sitex.php"; exit 1; }
          grep -q "^## \[$V\]" backend/CHANGELOG.md || { echo "::error::backend/CHANGELOG.md has no section for $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" > /dev/null; then
            echo "v$V already exists, nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' backend/CHANGELOG.md > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.tag.outputs.version }}
