name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sitexpost_test
          MYSQL_USER: sitexpost
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_mysql, redis, sodium, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # phpdotenv reads .env on every boot; without one, Pest 4 reports a warning on every test
      - run: cp .env.example .env
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pest (SQLite)
        run: vendor/bin/pest
      - name: Pest (MySQL 8.4)
        run: vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: sitexpost_test
          DB_USERNAME: sitexpost
          DB_PASSWORD: secret
      - name: Migrate + rollback (MySQL 8.4)
        run: |
          cp .env.example .env && php artisan key:generate
          php artisan migrate --force && php artisan migrate:rollback --force && php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: sitexpost_test
          DB_USERNAME: sitexpost
          DB_PASSWORD: secret

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
